name: Conditionals Demo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  conditional-job:
    runs-on: ubuntu-latest

    steps:
      - name: Always Run
        run: echo "This step always runs."

      - name: Run Only on Main Branch
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch."

      - name: Intentionally Fail
        run: exit 1
        continue-on-error: true

      - name: Run Only If Previous Step Failed
        if: failure()
        run: echo "The previous step failed."

  push-only-job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Push Event Only
        run: echo "This job runs only on push events."